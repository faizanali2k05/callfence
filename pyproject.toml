[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callfence"
version = "0.1.0"
description = "Deadlines and cancellation around sync or async Python calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["asyncio", "timeout", "deadline", "cancellation", "resilience"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/faizanali2k05/callfence"
Repository = "https://github.com/faizanali2k05/callfence"
Issues = "https://github.com/faizanali2k05/callfence/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/callfence"]
